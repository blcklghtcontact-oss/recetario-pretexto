<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Recetario de barra de Café Pretexto">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="logo-pretexto.png">
<title>Recetario Café Pretexto</title>
<link rel="icon" href="logo-pretexto.png">
<style>
[hidden]{display:none!important}
:root{
  --papel:#f6f2e6; --papel2:#efe9d8; --linea:#cfd8c3; --margen:#d9b98a;
  --oliva:#3b5236; --oliva2:#56684a; --romero:#8f9a76; --salvia:#b8c2a2; --salvia2:#dde3cf;
  --oro:#c2a05a; --oro2:#a8873f; --lapiz:#3d3d36; --lapiz2:#6b6a60; --rojo:#a9453a;
  --mesa:#2f2a22; --sombra:0 18px 40px rgba(0,0,0,.35);
  --mano:'Times New Roman',Times,serif;
  --titulo:'Times New Roman',Times,serif;
  --serif:'Times New Roman',Times,serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{padding-left:env(safe-area-inset-left, 0px);padding-right:env(safe-area-inset-right, 0px);background:var(--mesa);background-image:radial-gradient(ellipse at 30% 0%,#3f382d 0%,#2a251e 60%,#211d17 100%);color:var(--lapiz);font-family:var(--mano);font-size:19px;line-height:1.45;min-height:100vh}
button{font-family:inherit;font-size:inherit;cursor:pointer}
a{color:var(--oliva)}
/* ---------- barra superior */
.top{display:flex;align-items:center;gap:16px;padding:14px 24px;color:#e9e3d2;flex-wrap:wrap}
.top img{height:34px;filter:drop-shadow(0 1px 0 rgba(0,0,0,.3))}
.top .lema{font-family:var(--serif);font-style:italic;font-size:15px;opacity:.75}
.top .buscar{margin-left:auto;display:flex;align-items:center;background:#f6f2e6;border-radius:999px;padding:4px 14px;min-width:240px}
.top .buscar .limpiar{flex:none;border:0;background:#d9d2bf;color:#3d3d36;border-radius:50%;width:34px;height:34px;margin:-2px -8px -2px 6px;font-size:17px;line-height:34px;padding:0;-webkit-tap-highlight-color:transparent}
.top .buscar .limpiar:active{background:#c4bba3}
.top .buscar input{border:0;background:transparent;font-family:var(--mano);font-size:18px;width:100%;outline:none;color:var(--lapiz);padding:4px 0}
.estado-ia{font-size:15px;display:flex;align-items:center;gap:6px;opacity:.85}
.estado-ia i{width:9px;height:9px;border-radius:50%;background:#888;display:inline-block}
.estado-ia.ok i{background:#9bc27a}.estado-ia.mal i{background:#d0705e}
/* ---------- libreta */
.libreta{position:relative;max-width:1320px;margin:6px auto 40px;padding:0 70px 0 24px}
.pliego{display:grid;grid-template-columns:1fr 1fr;background:var(--papel);border-radius:6px 14px 14px 6px;box-shadow:var(--sombra);position:relative;min-height:calc(100vh - 120px)}
.pliego::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:46px;transform:translateX(-50%);background:linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.10) 42%,rgba(0,0,0,.18) 50%,rgba(0,0,0,.10) 58%,rgba(0,0,0,0) 100%);pointer-events:none;z-index:2}
.hoja{position:relative;padding:44px 46px 60px 76px;
  background-image:linear-gradient(90deg,transparent 58px,var(--margen) 58px,var(--margen) 60px,transparent 60px),repeating-linear-gradient(180deg,transparent 0,transparent 33px,var(--linea) 33px,var(--linea) 34px);
  background-position:0 0,0 18px;min-width:0}
.hoja.der{padding-left:60px;background-image:repeating-linear-gradient(180deg,transparent 0,transparent 33px,var(--linea) 33px,var(--linea) 34px);background-position:0 18px}
/* pestañas */
.pestanas{position:absolute;top:40px;right:12px;display:flex;flex-direction:column;gap:8px;z-index:3}
.pestana{writing-mode:vertical-rl;padding:14px 8px;border:0;border-radius:0 10px 10px 0;font-family:var(--titulo);font-size:17px;font-weight:700;color:#fbf8ef;box-shadow:3px 3px 8px rgba(0,0,0,.25);text-align:left;transition:transform .15s}
.pestana:hover,.pestana.activa{transform:translateX(6px)}
.pestana.activa{outline:2px solid rgba(255,255,255,.6);outline-offset:-4px}
/* tipografía de la hoja */
h1.t{font-family:var(--titulo);font-size:40px;line-height:1.05;margin:0 0 4px;color:var(--oliva);font-weight:700;letter-spacing:.01em}
.sub{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--lapiz2);margin:0 0 18px}
h2{font-family:var(--titulo);font-weight:700;font-size:23px;color:var(--oliva2);margin:20px 0 4px;line-height:1.15}
h2 small{font-family:var(--mano);font-size:15px;color:var(--lapiz2);font-weight:400}
ul,ol{margin:0;padding-left:24px}
li{margin:2px 0}
ol.pasos{list-style:none;padding:0;counter-reset:p}
ol.pasos li{counter-increment:p;position:relative;padding-left:40px;margin:6px 0}
ol.pasos li::before{content:counter(p);position:absolute;left:0;top:1px;width:28px;height:28px;border:2px solid var(--oliva2);border-radius:50%;text-align:center;line-height:24px;font-size:16px;color:var(--oliva2)}
ol.pasos li.extra{color:#4d5c6e}
ol.pasos li.extra::before{border-style:dashed;border-color:#7d8ea3;color:#7d8ea3}
.tip{display:inline-block;font-size:13px;background:#e3ebf3;color:#4d5c6e;border-radius:5px;padding:0 6px;margin-right:6px;transform:rotate(-2deg)}
ul.ing{list-style:none;padding:0}
ul.ing li{display:flex;gap:10px;align-items:flex-start}
ul.ing input{appearance:none;width:20px;height:20px;border:2px solid var(--lapiz2);border-radius:4px;margin-top:5px;flex:none;cursor:pointer;background:transparent}
ul.ing input:checked{background:var(--salvia);border-color:var(--oliva2)}
ul.ing input:checked+span{text-decoration:line-through;text-decoration-color:var(--oliva2);opacity:.6}
.sello{position:absolute;top:34px;right:46px;border:3px solid var(--rojo);color:var(--rojo);font-family:var(--serif);font-weight:500;font-size:14px;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;transform:rotate(8deg);border-radius:6px;opacity:.85}
.sello.nueva{border-color:var(--oro2);color:var(--oro2)}
/* tarjetas dentro de la hoja derecha */
.taza-box{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.taza-box svg{max-width:100%;height:auto}
.tamanos{display:flex;gap:8px;margin:6px 0 2px}
.tamanos button{border:2px solid var(--oliva2);background:transparent;color:var(--oliva2);border-radius:999px;padding:2px 14px}
.tamanos button.on{background:var(--oliva2);color:#fbf8ef}
.chips{display:flex;flex-direction:column;gap:6px}
.tiempo{display:flex;gap:10px;align-items:flex-start}
.crono{flex:none;border:2px solid var(--oro2);background:#fbf3df;color:var(--oro2);border-radius:999px;padding:0 12px;font-size:16px;min-width:94px;text-align:center}
.crono.corre{background:var(--oro);color:#fff}
.crono.listo{background:#7fa36a;border-color:#5f8a4d;color:#fff}
.crono.pasado{background:var(--rojo);border-color:var(--rojo);color:#fff}
.ojo{border:2px solid var(--rojo);border-radius:10px 14px 12px 16px;padding:8px 14px 10px;margin-top:8px;position:relative;background:rgba(169,69,58,.04)}
.ojo h2{color:var(--rojo);margin-top:0}
.ojo li::marker{color:var(--rojo)}
.postits{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
.postit{background:#f3e7a9;padding:10px 12px 12px;width:230px;box-shadow:2px 4px 8px rgba(0,0,0,.18);font-size:16px;line-height:1.3;transform:rotate(-1.5deg)}
.postit:nth-child(2n){transform:rotate(1.4deg);background:#e6eccf}
.postit b{display:block;font-size:13px;color:var(--lapiz2);font-weight:400;margin-bottom:3px}
.nota-nueva{display:flex;gap:8px;margin-top:10px}
.nota-nueva input{flex:1;border:0;border-bottom:2px dashed var(--lapiz2);background:transparent;font-family:var(--mano);font-size:18px;padding:4px 2px;outline:none}
.btn{border:2px solid var(--oliva);background:var(--oliva);color:#fbf8ef;border-radius:10px;padding:4px 14px}
.btn.claro{background:transparent;color:var(--oliva)}
.btn.oro{background:var(--oro);border-color:var(--oro2)}
/* índice */
.indice h2{border-bottom:2px solid var(--salvia);padding-bottom:2px}
.indice .fila{display:flex;align-items:baseline;gap:8px;padding:3px 0;cursor:pointer;color:var(--lapiz)}
.indice .fila:hover{color:var(--oliva)}
.indice .fila .pts{flex:1;border-bottom:2px dotted var(--salvia);transform:translateY(-5px)}
.indice .fila .est{font-size:14px;color:var(--rojo)}
.dibujo{margin:14px 0}
.leyenda{font-size:15px;color:var(--lapiz2)}
/* chat */
.abrir-chat{position:fixed;right:22px;bottom:22px;z-index:20;background:var(--oliva);color:#fbf8ef;border:0;border-radius:999px;padding:12px 20px;font-family:var(--titulo);font-size:19px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.chat{position:fixed;right:22px;bottom:22px;width:min(460px,calc(100vw - 32px));height:min(680px,calc(100vh - 44px));z-index:21;background:var(--papel);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.45);display:none;flex-direction:column;overflow:hidden;
  background-image:repeating-linear-gradient(180deg,transparent 0,transparent 31px,var(--salvia2) 31px,var(--salvia2) 32px)}
.chat.abierto{display:flex}
.chat header{background:var(--oliva);color:#fbf8ef;padding:10px 16px;display:flex;align-items:center;gap:10px}
.chat header b{font-family:var(--titulo);font-size:21px}
.chat header small{opacity:.8;font-size:14px}
.chat header #cerrarChat{margin-left:8px;background:transparent;border:0;color:#fbf8ef;font-size:26px;line-height:1}
.msgs{flex:1;overflow:auto;padding:14px}
.msg{max-width:88%;margin:8px 0;padding:8px 12px;border-radius:12px;white-space:pre-wrap;font-size:17px;line-height:1.35}
.msg.yo{margin-left:auto;background:var(--salvia2);border:1px solid var(--salvia)}
.msg.ia{background:#fffdf6;border:1px solid #e4dcc4}
.msg.err{background:#f6dcd7;border:1px solid #e0a89e}
.cambio{border:2px dashed var(--oro2);border-radius:10px;padding:8px 10px;margin:8px 0;background:#fbf3df;font-size:16px}
.cambio .tipo{font-family:var(--titulo);font-size:17px;font-weight:700;color:var(--oro2)}
.cambio ul{padding-left:20px}
.cambio .acc{display:flex;gap:8px;margin-top:6px}
.cambio.hecho{border-style:solid;border-color:#7fa36a;background:#eef3e6}
.sugs{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 8px}
.sugs button{border:1px solid var(--romero);background:#fbf8ef;color:var(--oliva2);border-radius:999px;padding:2px 10px;font-size:15px}
.entrada{display:flex;gap:8px;padding:10px 12px;border-top:2px solid var(--salvia);background:var(--papel2)}
.entrada textarea{flex:1;resize:none;border:0;background:transparent;font-family:var(--mano);font-size:18px;outline:none;height:52px}
.pensando{opacity:.7;font-style:italic}
/* inventario */
.inv-grupo{margin-bottom:10px}
.inv-item{display:flex;align-items:center;gap:8px}
.inv-item.no{text-decoration:line-through;color:var(--rojo)}
.inv-item button{border:0;background:transparent;color:var(--lapiz2);font-size:14px;text-decoration:underline}
/* responsivo */
/* tablet / laptop horizontal: mantener las dos hojas, más compacto */
@media (max-width: 1200px){
  body{font-size:17px}
  .libreta{padding:0 58px 0 12px}
  .hoja{padding:30px 26px 44px 66px}
  .hoja.der{padding-left:40px}
  h1.t{font-size:34px}
  .sello{right:24px}
}
/* celular o tablet acostada (poca altura): todo más compacto para ver la receta sin hacer scroll de más */
@media (orientation: landscape) and (max-height: 620px){
  body{font-size:15px;line-height:1.35}
  .top{padding:6px 14px;gap:10px}
  .top img{height:24px}
  .top .lema{display:none}
  .top .buscar{min-width:180px;padding:2px 10px}
  .top .buscar input{font-size:15px}
  .libreta{margin:2px auto 12px;padding:0 46px 0 8px}
  .pliego{min-height:calc(100vh - 52px)}
  .hoja{padding:18px 16px 28px 50px;background-position:0 0,0 12px;background-image:linear-gradient(90deg,transparent 40px,var(--margen) 40px,var(--margen) 42px,transparent 42px),repeating-linear-gradient(180deg,transparent 0,transparent 25px,var(--linea) 25px,var(--linea) 26px)}
  .hoja.der{padding-left:24px;background-image:repeating-linear-gradient(180deg,transparent 0,transparent 25px,var(--linea) 25px,var(--linea) 26px);background-position:0 12px}
  h1.t{font-size:26px}
  h2{font-size:18px;margin:12px 0 2px}
  .sub{font-size:13px;margin-bottom:8px}
  ol.pasos li{padding-left:30px;margin:3px 0}
  ol.pasos li::before{width:22px;height:22px;line-height:18px;font-size:13px}
  ul.ing input{width:16px;height:16px;margin-top:3px}
  .pestanas{top:14px;right:4px;gap:4px}
  .pestana{font-size:13px;padding:9px 5px}
  .taza-box svg{width:330px}
  .postit{width:180px;font-size:14px}
  .sello{top:10px;right:14px;font-size:11px}
  .abrir-chat{font-size:15px;padding:7px 12px;right:10px;bottom:10px}
  .chat{height:calc(100vh - 20px);bottom:10px;right:10px;width:min(420px,48vw)}
  .msg{font-size:15px}
  .crono{font-size:13px;min-width:74px;padding:0 8px}
  .tamanos button{padding:0 10px;font-size:14px}
  .btn{padding:2px 10px}
}
/* solo en vertical y angosto: una sola columna */
@media (orientation: portrait) and (max-width: 820px){
  .libreta{padding:0 12px}
  .pliego{grid-template-columns:1fr}
  .pliego::before{display:none}
  .hoja{padding:34px 20px 40px 70px}
  .hoja.der{padding:20px 20px 60px 70px;background-image:linear-gradient(90deg,transparent 58px,var(--margen) 58px,var(--margen) 60px,transparent 60px),repeating-linear-gradient(180deg,transparent 0,transparent 33px,var(--linea) 33px,var(--linea) 34px)}
  .pestanas{position:static;flex-direction:row;overflow-x:auto;padding:0 0 8px}
  .pestana{writing-mode:horizontal-tb;border-radius:10px 10px 0 0;padding:8px 14px;white-space:nowrap}
  .pestana:hover,.pestana.activa{transform:translateY(-3px)}
  .sello{top:12px;right:16px}
  .top .buscar{min-width:0;flex:1 1 100%}
  .abrir-chat{font-size:16px;padding:9px 14px;right:12px;bottom:12px}
}
/* táctil: índice fácil de tocar y un solo tamaño de letra en todas las recetas */
.indice .fila{font-size:22px;padding:11px 6px;min-height:50px;align-items:center;border-radius:8px;-webkit-tap-highlight-color:rgba(59,82,54,.15)}
.indice .fila:active{background:rgba(59,82,54,.12)}
.indice .fila .pts{transform:none}
.hoja{font-size:17px}
.hoja li,.hoja p:not(.sub),.hoja .postit,.hoja .crono,.hoja .tip,.hoja td{font-size:17px}
.hoja h1.t{font-size:30px}
.hoja h2{font-size:20px}
.pestana{min-width:44px}
.abrir-chat{right:74px}
@media (orientation: landscape) and (max-height: 620px){
  .indice .fila{font-size:19px;padding:9px 6px;min-height:44px}
  .abrir-chat{right:52px}
  .hoja,.hoja li,.hoja p:not(.sub),.hoja .postit,.hoja .crono,.hoja .tip,.hoja td{font-size:16px}
  .hoja h1.t{font-size:26px}
  .hoja h2{font-size:18px}
}
@media (orientation: portrait) and (max-width: 820px){
  .pestana{flex:none;min-width:0}
  .hoja,.hoja.der{padding:26px 18px 40px 36px;background-image:linear-gradient(90deg,transparent 22px,var(--margen) 22px,var(--margen) 24px,transparent 24px),repeating-linear-gradient(180deg,transparent 0,transparent 33px,var(--linea) 33px,var(--linea) 34px);background-position:0 0,0 18px}
  .hoja.der{padding-top:10px}
  .abrir-chat{right:12px}
}
/* banco de bebidas, dictado */
.indice .fila.banco span:first-child::after{content:' · banco';font-size:14px;color:var(--lapiz2);font-style:italic}
.sub-banco{display:inline-block;background:#eef0e4;border:1px dashed var(--romero);border-radius:8px;padding:4px 10px;font-size:15px;color:var(--oliva2);margin-bottom:10px}
ul.req{list-style:none;padding:0}
ul.req li{padding:6px 0;border-bottom:1px dotted var(--salvia)}
ul.req .si{color:#5f8a4d} ul.req .no{color:var(--rojo)} ul.req .rev{color:var(--oro2)}
.mic{flex:none;border:0;border-radius:999px;background:#e9e2cc;color:var(--oliva2);min-width:46px;height:46px;font-size:21px;padding:0 10px;-webkit-tap-highlight-color:transparent}
.mic.grabando{background:var(--rojo);color:#fff;animation:pulso 1s infinite}
.mic.ocupado{opacity:.6}
@keyframes pulso{50%{transform:scale(1.08)}}
.estado-voz{font-size:14px;color:var(--lapiz2);margin-top:4px;min-height:1em}
/* horizontal: los separadores se quedan en su lugar y la columna se desliza hacia arriba/abajo con el dedo */
@media not all and (orientation: portrait) and (max-width: 820px){
  .pestanas{max-height:calc(100vh - 200px);overflow-y:auto;overflow-x:hidden;padding:0 8px 12px 0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none;touch-action:pan-y}
  .pestanas::-webkit-scrollbar{display:none}
  .pestana{flex:none}
  .libreta{padding-right:62px}
  .pestanas{right:auto;left:calc(100% - 62px);padding-right:6px}
}
@media (orientation: landscape) and (max-height: 620px){ .pestanas{max-height:calc(100vh - 110px);top:14px} }
@media print{.abrir-chat,.chat,.top .buscar,.nota-nueva{display:none!important}body{background:#fff}.pliego{box-shadow:none}}
</style>
</head>
<body>
<div class="top">
  <img src="logo-pretexto.png" alt="Café Pretexto">
  <span class="lema">Recetario de barra</span>
  <span class="estado-ia" id="estadoIA"><i></i><span>revisando IA…</span></span>
  <button class="btn oro" id="pendBtn" hidden></button>
  <label class="buscar">🔍&nbsp;<input id="buscar" type="text" placeholder="Buscar bebida o ingrediente…" autocomplete="off"><button type="button" id="limpiarBusqueda" class="limpiar" aria-label="Borrar búsqueda" hidden>✕</button></label>
</div>

<div class="libreta">
  <nav class="pestanas" id="pestanas"></nav>
  <div class="pliego">
    <section class="hoja izq" id="izq"></section>
    <section class="hoja der" id="der"></section>
  </div>
</div>

<button class="abrir-chat" id="abrirChat">✎ Pregúntale a la libreta</button>
<div class="chat" id="chat" role="dialog" aria-label="Asistente del recetario">
  <header><div><b>Asistente de barra</b><br><small id="chatModelo">IA en este aparato</small></div><button class="btn oro" id="activarBtn" style="margin-left:auto;font-size:14px">Activar IA</button><button id="cerrarChat" aria-label="Cerrar">×</button></header>
  <div class="msgs" id="msgs"></div>
  <div class="sugs" id="sugs"></div>
  <div class="estado-voz" id="chatVoz" style="padding:0 12px"></div>
  <div class="entrada"><button type="button" class="mic" id="chatMic" aria-label="Dictar">🎤</button><textarea id="txt" placeholder="Ej. el latte grande quedó mejor con 5 s menos de vapor…"></textarea><button class="btn" id="enviar">Enviar</button></div>
</div>

<script>
const CATS = [
  { id:'inicio', nombre:'Índice', color:'#56684a' },
  { id:'tecnica', nombre:'Antes de empezar', color:'#8f9a76' },
  { id:'Café', nombre:'Café', color:'#6b4a2f' },
  { id:'Café Frío', nombre:'Café frío', color:'#4f6a78' },
  { id:'Matcha, Chai y Té', nombre:'Matcha, chai y té', color:'#6f8a4c' },
  { id:'Sodas y Frappés', nombre:'Sodas y frappés', color:'#b1764a' },
  { id:'Nuevas', nombre:'Nuevas', color:'#c2a05a' },
  { id:'banco', nombre:'Banco de bebidas', color:'#8a6d3b' },
  { id:'inventario', nombre:'Inventario', color:'#3b5236' },
];
let D = { recetas:[], inventario:[], tecnica:[] };
let vista = { cat:'inicio', slug:null, grande:false };
let chatHist = [];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

// ---------- datos (GitHub Pages): recetas del repositorio + cambios guardados en este aparato
let BASE = null;
const LS = 'pretexto-recetario-v1';
const hoy = () => { const d = new Date(), p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; };
const slugify = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60) || 'receta';
const ordenar = a => a.slice().sort((x,y) => (x.orden??999)-(y.orden??999) || x.titulo.localeCompare(y.titulo));
const clonar = o => JSON.parse(JSON.stringify(o));
const SECC = { 'ingredientes':'ingredientes','preparacion':'pasos','taza':'capas','taza-grande':'capasGrande','tiempos':'tiempos','evitar':'evitar','variaciones':'variaciones','notas':'notas' };
const aCapas = items => (items||[]).map(t => { if (typeof t === 'object' && t) return { nombre: t.nombre, pct: Number(t.porcentaje ?? t.pct) }; const m = String(t).match(/^(.*?):\s*(\d+(?:[.,]\d+)?)\s*%/); return m ? { nombre:m[1].trim(), pct:parseFloat(m[2].replace(',','.')) } : null; }).filter(Boolean);
const sinNumero = a => (a||[]).map(x => String(x).replace(/^\s*\d+[).\-]\s*/, ''));

function leerLocal(){ try { return JSON.parse(localStorage.getItem(LS)) || { recetas:{}, inventario:null, pendientes:[] }; } catch { return { recetas:{}, inventario:null, pendientes:[] }; } }
function guardarLocal(L){ try { localStorage.setItem(LS, JSON.stringify(L)); return true; } catch { return false; } }

function armar(){
  const L = leerLocal();
  const porSlug = Object.fromEntries(BASE.recetas.map(r => [r.slug, r]));
  for (const [slug, r] of Object.entries(L.recetas)) porSlug[slug] = r;
  D = { recetas: ordenar(Object.values(porSlug)), inventario: L.inventario || clonar(BASE.inventario), tecnica: BASE.tecnica, banco: BASE.banco || [] };
  const n = L.pendientes.length;
  const b = $('#pendBtn'); if (b){ b.hidden = !n; b.textContent = `${n} cambio${n===1?'':'s'} sin subir`; }
}

async function iniciar(){
  try { BASE = await (await fetch('datos.json', { cache: 'no-cache' })).json(); }
  catch { $('#izq').innerHTML = '<h1 class="t">No cargó el recetario</h1><p>Revisa la conexión a internet y recarga la página.</p>'; return; }
  armar(); pintarPestanas(); pintar();
  estadoIA();
}

async function aplicar(c){
  const L = leerLocal();
  const buscar = ref => { const s = slugify(ref||''); return D.recetas.find(r => r.slug===s) || D.recetas.find(r => slugify(r.titulo)===s) || D.recetas.find(r => s && (s.includes(r.slug) || r.slug.includes(s))); };
  let mensaje;
  try {
    if (c.tipo === 'agregar_nota'){
      const r = buscar(c.receta); if (!r) throw new Error(`No encontré la receta "${c.receta}"`);
      const n = clonar(r); n.notas = (n.notas||[]).concat([`[${hoy()}] ${String(c.texto||'').trim()}`]);
      L.recetas[n.slug] = n; mensaje = `Nota agregada a ${r.titulo}`;
    } else if (c.tipo === 'editar_seccion'){
      const r = buscar(c.receta); if (!r) throw new Error(`No encontré la receta "${c.receta}"`);
      const campo = SECC[slugify(c.seccion||'')]; if (!campo) throw new Error(`Sección no válida: ${c.seccion}`);
      if (!Array.isArray(c.items) || !c.items.length) throw new Error('La sección nueva viene vacía');
      const n = clonar(r); n[campo] = campo.startsWith('capas') ? aCapas(c.items) : (campo==='pasos' ? sinNumero(c.items) : c.items.map(String));
      L.recetas[n.slug] = n; mensaje = `"${c.seccion}" de ${r.titulo} actualizado`;
    } else if (c.tipo === 'nueva_receta'){
      if (!c.titulo) throw new Error('La receta nueva no tiene título');
      let slug = slugify(c.titulo); if (D.recetas.some(r => r.slug===slug)) slug += '-' + Date.now().toString().slice(-4);
      L.recetas[slug] = { slug, titulo:c.titulo, categoria:c.categoria||'Nuevas', estado:'nueva (probar)', orden:900, taza:c.taza||'', tamanos:'',
        ingredientes:(c.ingredientes||[]).map(String), pasos:sinNumero(c.pasos), capas:aCapas(c.capas), capasGrande:[], tiempos:(c.tiempos||[]).map(String),
        evitar:(c.evitar||[]).map(String), variaciones:(c.variaciones||[]).map(String), notas:[...(c.notas||[]).map(n => String(n).replace(/^\[sugerencia\]\s*/, `[${hoy()}] (banco) `)), `[${hoy()}] (asistente) Receta nueva, falta probarla.`] };
      mensaje = `Receta nueva guardada: ${c.titulo}`;
    } else if (c.tipo === 'inventario'){
      const g = clonar(D.inventario); const tiene = (i, x) => i.toLowerCase().includes(String(x).toLowerCase());
      for (const grp of g) grp.items = grp.items.map(i => { const base = i.replace(/\s*\(no hay\)\s*$/i,''); if ((c.marcar_agotado||[]).some(x => tiene(base,x))) return base + ' (no hay)'; if ((c.ya_hay||[]).some(x => tiene(base,x))) return base; return i; });
      const nuevos = (c.agregar||[]).filter(x => !g.some(grp => grp.items.some(i => tiene(i,x))));
      if (nuevos.length){ let o = g.find(x => x.grupo==='Agregado desde el recetario'); if (!o){ o = { grupo:'Agregado desde el recetario', items:[] }; g.push(o); } o.items.push(...nuevos.map(String)); }
      L.inventario = g; mensaje = 'Inventario actualizado';
    } else throw new Error(`Tipo de cambio desconocido: ${c.tipo}`);
    L.pendientes.push({ fecha: new Date().toISOString(), cambio: c });
    if (!guardarLocal(L)) throw new Error('Este navegador no deja guardar (¿modo privado?). El cambio no se guardó.');
    armar(); pintarPestanas(); pintar();
    return { mensaje: mensaje + ' (en este aparato)' };
  } catch(e){ return { error: String(e.message || e) }; }
}

// ---------- IA local en el navegador (WebLLM)
let LOCAL = null, webllm = null, cargandoIA = false, promesaIA = null, IA_FALLA = false;
const MOBILE = /Android|iPhone|iPod/i.test(navigator.userAgent);
const IPAD = /iPad/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
async function elegirModelo(){
  const ad = await navigator.gpu.requestAdapter(); if (!ad) return null;
  const f16 = ad.features.has('shader-f16') && !MOBILE;   // en celulares f16 da errores de GPU
  if (MOBILE) return 'Qwen2.5-0.5B-Instruct-q4f32_1-MLC';
  return f16 ? 'Qwen2.5-1.5B-Instruct-q4f16_1-MLC' : 'Qwen2.5-1.5B-Instruct-q4f32_1-MLC';
}
function estadoIA(txt, ok){
  const el = $('#estadoIA');
  if (txt){ el.className = 'estado-ia ' + (ok ? 'ok' : 'mal'); el.lastChild.textContent = txt; return; }
  if (LOCAL){ el.className='estado-ia ok'; el.lastChild.textContent='IA lista'; $('#chatModelo').textContent='IA en este aparato (Qwen)'; }
  else { el.className='estado-ia'; el.lastChild.textContent='IA sin activar'; $('#chatModelo').textContent='Toca "Activar IA" (la primera vez descarga ~1 GB)'; }
}
async function activarIA(auto){
  if (LOCAL) return true;
  if (promesaIA) return promesaIA;
  if (!navigator.gpu){ if (!auto) agregarMsg('err', 'Este navegador no puede correr la IA (le falta WebGPU). En iPad usa Safari con iPadOS 26 o más nuevo; en Android, Chrome actualizado. Las recetas y el chat básico sí funcionan.'); return false; }
  promesaIA = (async () => {
    cargandoIA = true;
    try {
      webllm = webllm || await import('https://esm.run/@mlc-ai/web-llm@0.2.85');
      const modelo = await elegirModelo(); if (!modelo) throw new Error('gpu');
      if (auto && !(await webllm.hasModelInCache(modelo))) { estadoIA(); return false; }
      const t0 = Date.now();
      estadoIA('Cargando IA… 0 %', false);
      LOCAL = await webllm.CreateMLCEngine(modelo, { initProgressCallback: p => {
        const pct = Math.round((p.progress||0)*100), seg = (Date.now()-t0)/1000;
        const resta = pct > 2 && pct < 100 ? ` (faltan ~${Math.max(1, Math.round(seg*(100-pct)/pct/60))} min)` : '';
        estadoIA(`Cargando IA… ${pct} %${resta}`, false); } });
      IA_FALLA = false; estadoIA(); return true;
    } catch(e){ console.error(e); LOCAL = null; if (!auto) agregarMsg('err', 'No se pudo activar la IA en este aparato (' + String(e.message||e).slice(0,120) + '). El chat sigue contestando con lo que dice el recetario.'); estadoIA(); return false; }
    finally { cargandoIA = false; promesaIA = null; }
  })();
  return promesaIA;
}

// ---------- chat v2: la IA solo redacta texto; las acciones las detecta la libreta
const N = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function recetaDe(texto, actual){
  const t = N(texto); let mejor = null, pts = 0;
  for (const r of D.recetas){
    const tit = N(r.titulo).replace(/[^a-z0-9 ]/g,' ');
    let p = 0;
    if (t.includes(tit)) p = 10 + tit.length;
    else { const w = tit.split(/\s+/).filter(x => x.length > 3); const hits = w.filter(x => t.includes(x)).length; if (hits) p = hits * 3 + (hits === w.length ? 3 : 0); }
    if (p > pts){ pts = p; mejor = r; }
  }
  return mejor || (actual ? D.recetas.find(r => r.slug === actual) : null);
}
function itemsInventario(){ return D.inventario.flatMap(g => g.items.map(i => i.replace(/\s*\(no hay\)\s*$/i,''))); }
function buscarItem(frase){
  const f = N(frase).replace(/^(el|la|los|las|de|del)\s+/,'').trim(); if (!f) return null;
  const items = itemsInventario();
  return items.find(i => N(i) === f) || items.find(i => N(i).includes(f)) || items.find(i => f.split(/\s+/).filter(w => w.length > 3).every(w => N(i).includes(w))) || null;
}
async function generar(sistema, usuario, max = 450){
  const r = await LOCAL.chat.completions.create({ messages: [{ role:'system', content: sistema }, { role:'user', content: usuario }], temperature: 0.3, max_tokens: max });
  return (r.choices?.[0]?.message?.content || '').trim();
}
function contexto(r){
  if (!r) return '';
  return `RECETA: ${r.titulo}\nIngredientes: ${r.ingredientes.join('; ')}\nPreparación: ${r.pasos.map((p,i)=>`${i+1}) ${p.replace(/^➕\s*/,'')}`).join(' ')}\nTaza: ${(r.capas||[]).map(c=>`${c.nombre} ${c.pct}%`).join(', ')}\nTiempos: ${r.tiempos.join(' | ')}\nEvitar: ${r.evitar.join(' | ')}\nVariaciones: ${r.variaciones.join(' | ')}\nNotas del equipo: ${(r.notas||[]).join(' | ') || 'ninguna'}`;
}

async function chatIA0(hist, recetaActual){
  const ultimo = [...hist].reverse().find(m => m.role==='user'); const q = ultimo ? ultimo.content : ''; const t = N(q);
  const r = recetaDe(q, recetaActual);

  // 1) inventario: "se acabó X", "ya no hay X", "llegó X"
  let m = t.match(/(?:se acabo|se acabaron|ya no hay|no hay|se termino|se terminaron)\s+(?:el |la |los |las |de )?(.+?)[.!]*$/);
  if (m){ const it = buscarItem(m[1]); return it ? { respuesta: `Va, marco "${it}" como agotado en el inventario.`, faltan: [], cambios: [{ tipo:'inventario', marcar_agotado:[it] }] }
                                              : { respuesta: `No encontré "${m[1]}" en el inventario. ¿Lo agrego como algo que ya no hay?`, faltan: [], cambios: [] }; }
  m = t.match(/(?:ya llego|llego|llegaron|ya hay|compramos|ya tenemos)\s+(?:el |la |los |las |nuevo |nueva )?(.+?)[.!]*$/);
  if (m){ const it = buscarItem(m[1]); const nombre = q.slice(q.toLowerCase().lastIndexOf(m[1].split(' ')[0]) ).trim() || m[1];
    return it ? { respuesta: `Va, "${it}" vuelve a estar disponible.`, faltan: [], cambios: [{ tipo:'inventario', ya_hay:[it] }] }
              : { respuesta: `"${nombre}" no estaba en el inventario. ¿Lo agrego?`, faltan: [], cambios: [{ tipo:'inventario', agregar:[nombre.replace(/^\w/, c => c.toUpperCase())] }] }; }

  // 2) notas: "anota que…", "quedó mejor con…", "hay que…"
  if (/^(anota|apunta|nota|agrega una nota|guarda que|registra)/.test(t) || /(quedo mejor|quedo peor|salio mejor|salio mal|funciono mejor|hay que cambiar|mejor con)/.test(t)){
    if (!r) return { respuesta: '¿En qué receta lo anoto? Ábrela o dime su nombre.', faltan: [], cambios: [] };
    let texto = q.replace(/^\s*(anota|apunta|nota|registra|guarda)\s*(en el|en la|en)?\s*/i,'');
    const tit = r.titulo.split(/\s*\/\s*/)[0]; if (N(texto).startsWith(N(tit))) texto = texto.slice(tit.length);
    texto = texto.replace(/^\s*(que|:|,)\s*/i,'').trim(); texto = texto.charAt(0).toUpperCase() + texto.slice(1);
    return { respuesta: `Lo anoto en ${r.titulo}. Si después lo confirman, Alberto puede pasarlo a la receta.`, faltan: [], cambios: [{ tipo:'agregar_nota', receta:r.slug, texto }] };
  }

  // 3) bebida que no está en el recetario
  const pide = canon(q).match(/(?:nos pidieron|pidieron|piden|pidio|quieren|receta de|como (?:lo )?(?:hago|preparo)|como se (?:hace|prepara))\s+(?:un |una |el |la |los |las )?([a-z0-9 ]+?)\s*(?:[,?.!¿]|$|\scon\s|\sque\s|\spara\s)/);
  let pedido = pide ? pide[1].trim() : ''; if (/^(para|que|si|cuando|se|lo|le|mas|mejor|bien|eso|esto)\b/.test(pedido)) pedido = '';
  const existente = pedido && D.recetas.find(x => { const a = N(x.titulo).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); return a === pedido || x.slug.replace(/-/g,' ') === pedido || a.split(' / ').includes(pedido); });
  if (existente){ return { respuesta: `Sí está en el recetario: te abro la hoja del ${existente.titulo}.`, faltan: [], cambios: [], abrir: existente.slug }; }
  if (pedido && !existente){
    const bb = buscarBanco(pedido);
    if (bb){ const faltan = faltantesDe(bb);
      return { respuesta: `"${bb.nombre}" no está en el recetario de la casa, pero sí en el banco de bebidas (sugerencia sin probar):\n\nIngredientes:\n${bb.ingredientes.map(x=>'- '+x).join('\n')}\n\nPasos:\n${bb.pasos.map((x,i)=>`${i+1}. ${x}`).join('\n')}${bb.tip ? '\n\nTip: ' + bb.tip : ''}`,
        faltan, cambios: [cambioDeBanco(bb)], abrirBanco: bb.nombre }; }
  }
  if (IA_FALLA) return sinIA(q, r);
  if (!LOCAL){ const ok = await activarIA(false); if (!ok) return sinIA(q, r); }

  if (pedido && !existente){
    const inv = itemsInventario().filter(i => !/\(no hay\)/i.test(i)).join(', ');
    const pal = pedido.split(/\s+/).filter(w => w.length > 2);
    const parecidas = D.recetas.filter(x => pal.some(w => N(x.titulo).includes(w) || N(x.ingredientes.join(' ')).includes(w))).slice(0, 2);
    const refs = parecidas.length ? '\nRECETAS PARECIDAS DE LA CASA (úsalas como base):\n' + parecidas.map(contexto).join('\n\n') : '';
    const txt = await generar(
      `Eres barista en Café Pretexto (México). Escribe en español una receta corta para la bebida que pidan, usando las medidas de la casa: 1 espresso = 70 ml, leche chico 150 ml, grande 240 ml, 1 oz = 30 ml.
INVENTARIO DE LA BARRA: ${inv}.${refs}
Ojo: chai = té negro especiado (concentrado de chai), NO es chía. Taro, matcha, horchata, etc. son sabores, no café.
Responde EXACTAMENTE con este formato y nada más:
NOMBRE: <nombre de la bebida>
INGREDIENTES:
- <ingrediente con cantidad>
PASOS:
- <paso>
FALTAN:
- <ingrediente que normalmente lleva y NO está en el inventario, o "nada">`, q, 500);
    const sec = { NOMBRE:'', INGREDIENTES:[], PASOS:[], FALTAN:[] }; let cur = null;
    for (const l of txt.split('\n')){ const h = l.match(/^\s*\**(NOMBRE|INGREDIENTES|PASOS|FALTAN)\**\s*:\s*(.*)$/i); if (h){ cur = h[1].toUpperCase(); if (cur==='NOMBRE') sec.NOMBRE = h[2].trim(); else if (h[2].trim()) sec[cur].push(h[2].trim()); continue; }
      const it = l.match(/^\s*(?:[-*•]|\d+[.)])\s*(.+)$/); if (it && cur && cur !== 'NOMBRE') sec[cur].push(it[1].trim()); }
    const todoInv = N(itemsInventario().join(' ') + ' ' + D.recetas.map(x => x.titulo + ' ' + x.ingredientes.join(' ')).join(' '));
    const desconocidas = pal.filter(w => !todoInv.includes(w) && !/^(con|sin|de|del|grande|chico|frio|caliente|helado)$/.test(w));
    const faltan = [...desconocidas.map(w => `${w.replace(/^\w/, c => c.toUpperCase())} (no está en el inventario)`), ...sec.FALTAN.filter(x => !/^(nada|ninguno|ninguna)\.?$/i.test(x))];
    if (!sec.INGREDIENTES.length || !sec.PASOS.length) return { respuesta: txt || 'No pude armar la receta. Intenta preguntarlo de otra forma.', faltan: [], cambios: [] };
    const titulo = sec.NOMBRE || pedido || 'Bebida nueva';
    return { respuesta: `Borrador sin probar (hecho por la IA, ajústenlo cuando lo preparen):\n\nIngredientes:\n${sec.INGREDIENTES.map(x=>'- '+x).join('\n')}\n\nPasos:\n${sec.PASOS.map((x,i)=>`${i+1}. ${x}`).join('\n')}`,
      faltan, cambios: [{ tipo:'nueva_receta', titulo: titulo.replace(/^\w/, c => c.toUpperCase()), categoria:'Nuevas', ingredientes: sec.INGREDIENTES, pasos: sec.PASOS, tiempos: [], evitar: [], variaciones: [] }] };
  }

  // 4) duda sobre una receta (o general)
  const previos = hist.slice(-5, -1).map(x => (x.role==='user' ? 'Barista: ' : 'Tú: ') + String(x.content).slice(0, 400)).join('\n');
  const sistema = `Eres el asistente de barra de Café Pretexto (México). Contesta en español, en 2 a 5 líneas, práctico y directo, usando SOLO esta información del recetario. Si no viene en la información, di que no está en el recetario.
${r ? contexto(r) : 'RECETAS DISPONIBLES: ' + D.recetas.map(x => x.titulo).join(', ')}
${r ? '' : '\nTÉCNICA DE LA BARRA: ' + D.tecnica.map(s => s.titulo + ': ' + s.items.join(' ')).join(' ').slice(0, 2500)}`;
  const txt = await generar(sistema, (previos ? previos + '\n' : '') + 'Barista: ' + q, 350);
  return { respuesta: txt || '(sin respuesta)', faltan: [], cambios: [] };
}


// ---------- respaldo: contestar con el texto del recetario cuando la IA no puede correr
const VACIAS = new Set('como cuanto cuantos cuantas cuando donde para porque pero esta este esto tiene tienen hace hago hacer lleva llevar receta bebida quiero puedo debo cual cuales tiempo mucho poco favor'.split(' '));
function sinIA(q, r){
  const pal = N(q).replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w => w.length > 3 && !VACIAS.has(w));
  const raiz = w => w.replace(/(es|s)$/,'');
  const puntua = txt => { const n = N(txt); return pal.reduce((a,w) => a + (n.includes(raiz(w)) ? 1 : 0), 0); };
  let fuente = [];
  if (r){ const sec = [['Ingredientes', r.ingredientes], ['Paso', r.pasos], ['Tiempos', r.tiempos], ['Evitar', r.evitar], ['Variación', r.variaciones], ['Nota', r.notas||[]]];
    for (const [k, arr] of sec) for (const x of arr) fuente.push(k + ': ' + String(x).replace(/^➕\s*/,'')); }
  else for (const t of D.tecnica) for (const x of t.items) fuente.push(t.titulo + ': ' + x);
  const qn = N(q), bono = x => (/tiempo|segundo|tarda|vapor/.test(qn) && /^Tiempos/.test(x) ? 3 : 0) + (/evitar|quema|mal|error/.test(qn) && /^Evitar/.test(x) ? 2 : 0) + (/lleva|ingrediente|cuant[oa]s? (ml|g|oz)/.test(qn) && /^Ingredientes/.test(x) ? 2 : 0);
  const top = fuente.map(x => [puntua(x) + (puntua(x) ? bono(x) : 0), x]).filter(a => a[0] > 0).sort((a,b) => b[0]-a[0]).slice(0, 4).map(a => '• ' + a[1]);
  const aviso = 'La IA no está corriendo en este aparato, así que te contesto con lo que dice el recetario:';
  if (r && top.length) return { respuesta: `${aviso}\n\n${r.titulo}\n${top.join('\n')}`, faltan: [], cambios: [], abrir: r.slug };
  if (r) return { respuesta: `${aviso} te abro la hoja del ${r.titulo}.`, faltan: [], cambios: [], abrir: r.slug };
  const bb = buscarBanco(q.replace(/^.*?(pidieron|piden|receta de|hago|hace|prepara)\s+(un|una|el|la)?\s*/i,'').replace(/[?¿!.,]/g,''));
  if (bb) return { respuesta: `En el banco de bebidas está "${bb.nombre}" (sugerencia sin probar):\n\nIngredientes:\n${bb.ingredientes.map(x=>'- '+x).join('\n')}\n\nPasos:\n${bb.pasos.map((x,i)=>`${i+1}. ${x}`).join('\n')}`, faltan: faltantesDe(bb), cambios: [] };
  if (top.length) return { respuesta: `${aviso}\n\n${top.join('\n')}`, faltan: [], cambios: [] };
  return { respuesta: 'No encontré eso en el recetario. Dime el nombre de la bebida (ej. "¿cuánto vapor lleva el latte?") o búscala arriba.', faltan: [], cambios: [] };

async function chatIA(hist, recetaActual){

function revisarReq(req){
  const STOP = new Set(['de','del','la','el','en','para','y','con','los','las']);

  const it = items.find(i => { const iw = pal(i); return pal(req).every(w => iw.some(x => casa(w, x))); });

  return 'no';
}

// cronómetro: cuenta hacia arriba y cambia de color al entrar al rango y al pasarse
let crono = null;
function beep(f){ try{ const c = new (window.AudioContext||window.webkitAudioContext)(); const o=c.createOscillator(), g=c.createGain(); o.frequency.value=f; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(.2,c.currentTime); o.start(); o.stop(c.currentTime+.25);}catch{} }
function cronometro(btn){
  if (crono){ clearInterval(crono.id); crono.btn.className='crono'; crono.btn.textContent=crono.txt; if (crono.btn===btn){ crono=null; return; } }
  const a=+btn.dataset.a, b=+btn.dataset.b, t0=Date.now(), txt=btn.textContent;
  let avisoA=false, avisoB=false;
  crono = { btn, txt, id:setInterval(()=>{
    const s=(Date.now()-t0)/1000;
    btn.textContent = `${s.toFixed(0)} s / ${a===b?a:a+'–'+b}`;
    btn.className = 'crono ' + (s<a?'corre':(s<=b?'listo':'pasado'));
    if (s>=a && !avisoA){ avisoA=true; beep(880); }
    if (s>b && !avisoB){ avisoB=true; beep(330); }
  },200)};
}

  const capas = (grande && r.capasGrande.length ? r.capasGrande : r.capas).slice().reverse(); // de abajo hacia arriba
  const tipo = tipoVaso(r);
  const W=420,H=330; let interior, contorno, extras='', y0, y1, xL, xR;
  if (tipo==='vaso'){ y0=40; y1=300; xL=118; xR=262;
    interior=`M120 40 L260 40 L245 300 L135 300 Z`; contorno=`<path d="M114 36 L266 36 L250 304 L130 304 Z" fill="none"/>`; }
  else if (tipo==='demi'){ y0=150; y1=290; xL=135; xR=245;
    interior=`M138 150 L242 150 Q240 285 190 290 Q140 285 138 150 Z`; contorno=`<path d="M132 146 L248 146 Q246 292 190 296 Q134 292 132 146 Z" fill="none"/><path d="M247 175 q38 4 30 42 q-6 24 -36 26" fill="none"/><ellipse cx="190" cy="304" rx="92" ry="10" fill="none"/>`; }
  else { y0=96; y1=292; xL=104; xR=276;
    interior=`M106 96 L274 96 Q270 280 190 292 Q110 280 106 96 Z`; contorno=`<path d="M100 92 L280 92 Q276 286 190 298 Q104 286 100 92 Z" fill="none"/><path d="M279 130 q56 6 44 66 q-9 36 -56 40" fill="none"/><ellipse cx="190" cy="308" rx="120" ry="12" fill="none"/>`; }
  const total = capas.reduce((s,c)=>s+c.pct,0) || 100;
  const alto = (y1-y0)*0.94; let y=y1, rects='', etiquetas='';
  const lab = [];
  capas.forEach((c,i)=>{
    const h = alto * c.pct/total; y -= h;
    rects += `<rect x="60" y="${y.toFixed(1)}" width="260" height="${(h+0.6).toFixed(1)}" fill="${color(c.nombre)}"/>`;
    if (/hielo/i.test(c.nombre)) for (let k=0;k<Math.max(2,Math.round(h/34));k++){ const cx = xL+20+((k*53)%((xR-xL)-50)), cy = y+10+((k*29)%Math.max(12,h-30)); rects+=`<rect x="${cx}" y="${cy}" width="28" height="24" rx="5" fill="rgba(255,255,255,.75)" stroke="#9fb8c4" stroke-width="1.5" transform="rotate(${(k%3-1)*12} ${cx+14} ${cy+12})"/>`; }
    lab.push({ y: y + h/2, txt: `${c.nombre} ${c.pct}%` });
  });
  // separar etiquetas para que no se encimen
  lab.sort((a,b)=>a.y-b.y); for (let i=1;i<lab.length;i++) if (lab[i].y - lab[i-1].y < 28) lab[i].y = lab[i-1].y + 28;
  const ladoX = tipo==='vaso'? 278 : (tipo==='demi'? 290 : 330);
  lab.forEach(l => { etiquetas += `<path d="M${xR-14} ${l.y.toFixed(1)} L${ladoX} ${l.y.toFixed(1)}" stroke="#6b6a60" stroke-width="1.4" stroke-dasharray="3 3" fill="none"/><text x="${ladoX+4}" y="${(l.y+5).toFixed(1)}" font-family="Times New Roman, serif" font-size="21" fill="#3d3d36">${esc(l.txt)}</text>`; });
  const id = 'c'+Math.random().toString(36).slice(2,8);
  const vy = tipo==='vaso'?20:(tipo==='demi'?110:66);
  return `<svg viewBox="40 ${vy} ${W+195} ${H+10-vy}" width="${ancho}" role="img" aria-label="Proporciones de ${esc(r.titulo)}">
    <defs><clipPath id="${id}"><path d="${interior}"/></clipPath>
    <filter id="${id}f"><feTurbulence baseFrequency=".04" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter></defs>
    <g clip-path="url(#${id})">${rects}</g>
    <g stroke="#3d3d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#${id}f)">${contorno}</g>
    ${tipo!=='vaso' && /capuchino|latte|flat|moka|cortado/i.test(r.slug) ? `<path d="M175 ${y0+14} q15 -12 30 0 q-15 10 -30 0" fill="none" stroke="#c9ab7c" stroke-width="2"/>` : ''}
    ${etiquetas}
  </svg>`;
}

function pintarTecnica(){
  const sec = D.tecnica;
  const mitad = Math.ceil(sec.length/2);
  const bloque = s => `<h2>${esc(s.titulo)}</h2><ul>${s.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`;
  $('#izq').innerHTML = `<h1 class="t">Antes de empezar</h1><p class="sub">Nombres de la barra y técnica de leche y espresso</p>${sec.slice(0,mitad).map(bloque).join('')}`;
  $('#der').innerHTML = `<h2 style="margin-top:0">La jarra y sus cuadrantes</h2><div class="dibujo">${jarraSVG()}</div><p class="leyenda">Vista desde arriba. La lanceta entra por el IV cuadrante para que la leche gire.</p>
    <h2>Temperatura de la leche</h2><div class="dibujo">${termometroSVG()}</div>${sec.slice(mitad).map(bloque).join('')}`;
}

function pintarInventario(){
  const g = D.inventario;
  const mitad = Math.ceil(g.length/2);
  const col = arr => arr.map(x => `<div class="inv-grupo"><h2>${esc(x.grupo)}</h2>${x.items.map(i=>{ const no=/\(no hay\)/i.test(i); const n=i.replace(/\s*\(no hay\)/i,''); return `<div class="inv-item ${no?'no':''}"><span>${esc(n)}</span><button data-n="${esc(n)}" data-no="${no?1:0}">${no?'ya llegó':'se acabó'}</button></div>`; }).join('')}</div>`).join('');
  $('#izq').innerHTML = `<h1 class="t">Inventario</h1><p class="sub">Lo que hay en la barra. El asistente lo usa para armar bebidas que no están en el recetario.</p>${col(g.slice(0,mitad))}`;
  $('#der').innerHTML = `${col(g.slice(mitad))}<p class="leyenda">Para agregar algo nuevo díganle al asistente: "llegó jarabe de lavanda".</p>`;
  document.querySelectorAll('.inv-item button').forEach(b => b.onclick = async () => {
    const cambio = b.dataset.no==='1' ? { tipo:'inventario', ya_hay:[b.dataset.n] } : { tipo:'inventario', marcar_agotado:[b.dataset.n] };
    const r = await aplicar(cambio);
    if (r.error) alerta(r.error);
  });
}

function alerta(t){ abrirChat(); agregarMsg('err', t); }

// ---------- chat
function abrirChat(){ $('#chat').classList.add('abierto'); $('#abrirChat').style.display='none'; if (!$('#msgs').children.length) bienvenida(); }
$('#abrirChat').onclick = abrirChat;
$('#cerrarChat').onclick = () => { $('#chat').classList.remove('abierto'); $('#abrirChat').style.display=''; };
function bienvenida(){
  agregarMsg('ia', 'Hola, soy la libreta. Pregúntenme cómo se hace algo, cuéntenme cómo les fue al probar una receta para anotarlo, o pídanme una bebida que no esté y la armo con lo que hay.');
  const s = ['¿Cuánto tiempo vaporizo la leche del capuchino grande?', 'Anota que el latte grande quedó mejor con 5 s menos de vapor', 'Nos pidieron un chai latte, ¿cómo lo hago?', 'Se acabó el jarabe de chocolate'];
  $('#sugs').innerHTML = s.map(x=>`<button>${esc(x)}</button>`).join('');
  document.querySelectorAll('#sugs button').forEach(b => b.onclick = () => { $('#txt').value = b.textContent; $('#txt').focus(); });
}
function agregarMsg(tipo, texto){
  const d = document.createElement('div'); d.className = 'msg ' + tipo; d.innerHTML = esc(texto).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); $('#msgs').appendChild(d); $('#msgs').scrollTop = 1e9; return d;
}
function describirCambio(c){
  const L = a => `<ul>${(a||[]).map(x=>`<li>${esc(typeof x==='string'?x:(x.nombre+': '+(x.porcentaje??x.pct)+'%'))}</li>`).join('')}</ul>`;
  const rec = c.receta ? (D.recetas.find(r=>r.slug===c.receta)?.titulo || c.receta) : '';
  if (c.tipo==='agregar_nota') return `<div class="tipo">Nota para ${esc(rec)}</div>${esc(c.texto)}`;
  if (c.tipo==='editar_seccion') return `<div class="tipo">Cambiar "${esc(c.seccion)}" de ${esc(rec)}</div>${c.motivo?`<i>${esc(c.motivo)}</i>`:''}${L(c.items)}`;
  if (c.tipo==='nueva_receta') return `<div class="tipo">Receta nueva: ${esc(c.titulo)}</div><b>Ingredientes</b>${L(c.ingredientes)}<b>Pasos</b>${L(c.pasos)}`;
  if (c.tipo==='inventario') return `<div class="tipo">Inventario</div>${c.agregar?.length?'Agregar: '+esc(c.agregar.join(', '))+'<br>':''}${c.marcar_agotado?.length?'Se acabó: '+esc(c.marcar_agotado.join(', '))+'<br>':''}${c.ya_hay?.length?'Ya hay: '+esc(c.ya_hay.join(', ')):''}`;
  return `<div class="tipo">${esc(c.tipo)}</div><pre>${esc(JSON.stringify(c,null,1))}</pre>`;
}
async function enviar(){
  const t = $('#txt').value.trim(); if (!t) return;
  $('#txt').value=''; $('#sugs').innerHTML='';
  agregarMsg('yo', t); chatHist.push({ role:'user', content:t });
  const p = agregarMsg('ia pensando', 'Pensando…');
  try{
    const r = await chatIA(chatHist, vista.slug);
    p.remove();
    if (r.error){ agregarMsg('err', 'No pude hablar con la IA: ' + r.error + '\n'); return; }
    let texto = r.respuesta; if (r.faltan?.length) texto += `\n\nFalta: ${r.faltan.join(', ')}`;
    agregarMsg('ia', texto);
    if (r.abrir) abrir(r.abrir);
    if (r.abrirBanco) abrirBanco(r.abrirBanco);
    chatHist.push({ role:'assistant', content: JSON.stringify({respuesta:r.respuesta, cambios:r.cambios}) });
    for (const c of r.cambios||[]){
      const d = document.createElement('div'); d.className='cambio';
      d.innerHTML = describirCambio(c) + `<div class="acc"><button class="btn oro">Aplicar</button><button class="btn claro">No</button></div>`;
      const [si,no] = d.querySelectorAll('button');
      si.onclick = async () => {
        const res = await aplicar(c);
        if (res.error){ agregarMsg('err', res.error); return; }
        d.classList.add('hecho'); d.querySelector('.acc').innerHTML = '✓ ' + esc(res.mensaje);
      };
      no.onclick = () => { d.querySelector('.acc').innerHTML = 'Descartado'; d.style.opacity=.6; };
      $('#msgs').appendChild(d); $('#msgs').scrollTop = 1e9;
    }
  }catch(e){ p.remove(); agregarMsg('err', 'Error: '+e.message); }
}
$('#enviar').onclick = enviar;
// ---------- dictado
let WHISPER = null, cargandoWhisper = null, grabadora = null;
async function cargarWhisper(estado){
  if (WHISPER) return WHISPER;
  if (!cargandoWhisper) cargandoWhisper = (async () => {
    const { pipeline, env } = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1');
    env.allowLocalModels = false;
    WHISPER = await pipeline('automatic-speech-recognition', 'Xenova/whisper-base', { device:'wasm', progress_callback: p => { if (p.status === 'progress' && p.file && /onnx/.test(p.file)) estado(`Preparando el dictado (solo la primera vez)… ${Math.round(p.progress||0)} %`); } });
    return WHISPER;
  })().catch(e => { cargandoWhisper = null; throw e; });
  return cargandoWhisper;
}
async function audioA16k(blob){
  const buf = await blob.arrayBuffer();
  const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate:16000 });
  const audio = await ctx.decodeAudioData(buf); ctx.close();
  return audio.getChannelData(0);
}
function dictadoNavegador(btn, destino, estado){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return false;
  const rec = new SR(); rec.lang = 'es-MX'; rec.interimResults = false; rec.maxAlternatives = 1;
  btn.classList.add('grabando'); estado('Escuchando… habla ahora');
  rec.onresult = e => { const t = e.results[0][0].transcript; destino.value = (destino.value ? destino.value + ' ' : '') + t; destino.dispatchEvent(new Event('input')); };
  rec.onerror = e => estado('No se entendió (' + e.error + '). Intenta de nuevo.');
  rec.onend = () => { btn.classList.remove('grabando'); if (/Escuchando/.test(btn.dataset.e||'')) estado(''); };
  rec.start(); return true;
}
function enlazarMic(btn, destino, salida){
  if (!btn) return;
  const estado = t => { salida.textContent = t; btn.dataset.e = t; };
  if (!navigator.mediaDevices?.getUserMedia && !(window.SpeechRecognition || window.webkitSpeechRecognition)) { btn.hidden = true; return; }
  btn.onclick = async () => {
    if (grabadora && grabadora.state === 'recording'){ grabadora.stop(); return; }
    if (btn.classList.contains('ocupado')) return;
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio:true }); }
    catch(e){ if (!dictadoNavegador(btn, destino, estado)) estado('No tengo permiso para el micrófono. Actívalo en el candado de la barra del navegador.'); return; }
    cargarWhisper(estado).catch(() => {});            // se descarga mientras hablas
    const trozos = []; grabadora = new MediaRecorder(stream);
    grabadora.ondataavailable = e => e.data.size && trozos.push(e.data);
    grabadora.onstop = async () => {
      stream.getTracks().forEach(t => t.stop()); btn.classList.remove('grabando'); btn.classList.add('ocupado');
      try {
        estado('Transcribiendo…');
        const [w, audio] = await Promise.all([cargarWhisper(estado), audioA16k(new Blob(trozos, { type: grabadora.mimeType }))]);
        estado('Transcribiendo…');
        const r = await w(audio, { language:'spanish', task:'transcribe', chunk_length_s:30 });
        const t = String(r.text || '').trim();
        if (t){ destino.value = (destino.value ? destino.value + ' ' : '') + t; destino.dispatchEvent(new Event('input')); destino.focus(); estado('Listo. Revísala y guárdala.'); }
        else estado('No se escuchó nada. Intenta de nuevo, más cerca del aparato.');
      } catch(e){ console.error(e); estado(''); if (!dictadoNavegador(btn, destino, estado)) estado('No se pudo transcribir en este aparato. Escríbela, porfa.'); }
      finally { btn.classList.remove('ocupado'); }
    };
    grabadora.start(); btn.classList.add('grabando'); estado('Grabando… toca 🎤 otra vez para terminar');
  };
}
enlazarMic($('#chatMic'), $('#txt'), $('#chatVoz'));
$('#txt').addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); enviar(); } });
const verX = () => { $('#limpiarBusqueda').hidden = !$('#buscar').value; };
$('#buscar').addEventListener('input', () => { verX(); vista.banco = null; pintar(); });
$('#limpiarBusqueda').addEventListener('click', e => { e.preventDefault(); $('#buscar').value = ''; verX(); $('#buscar').blur(); vista.banco = null; pintar(); });

iniciar(); activarIA(true);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
$('#pendBtn').onclick = () => { vista.slug = null; abrirPendientes(); };
$('#activarBtn').onclick = async () => { $('#activarBtn').disabled = true; const ok = await activarIA(false); $('#activarBtn').hidden = ok; $('#activarBtn').disabled = false; };
